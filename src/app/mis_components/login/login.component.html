<div class="container mt-5" style="max-width: 420px;">
	<h1 class="mb-4">Iniciar sesión</h1>
	<form #loginForm="ngForm" (ngSubmit)="login(username.value, password.value)">
		<div class="mb-3">
			<label for="username" class="form-label">Usuario</label>
			<input #username id="username" name="username" class="form-control" required value="emilys">
		</div>
		<div class="mb-3">
			<label for="password" class="form-label">Contraseña</label>
			<input #password id="password" name="password" type="password" class="form-control" required value="emilyspass">
		</div>
		<button class="btn btn-primary" type="submit" [disabled]="loginForm.invalid">Entrar</button>
		<p *ngIf="error" class="alert alert-danger mt-3">{{ error }}</p>
	</form>
</div>
